    <rect x="0.75" y="0.75" width="338.5" height="62.5" fill="none" stroke="#D4A017" stroke-width="1.5" rx="11"/>
    <rect width="64" height="64" fill="url(#num1)"/>
    <text x="32" y="41" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="700" fill="#0d1117" text-anchor="middle">1</text>
    <text x="88" y="38" font-family="Verdana, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFE066" letter-spacing="1.5">AURA</text>
    <rect x="-90" y="0" width="70" height="64" fill="url(#shimmer1)" transform="skewX(-25)">
      <animate attributeName="x" from="-90" to="360" dur="2.8s" repeatCount="indefinite"/>
    </rect>
